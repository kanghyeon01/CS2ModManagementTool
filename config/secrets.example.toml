# Controller secrets. Copy to secrets.toml next to controller.toml, then `chmod 600 secrets.toml`.
# Never commit the real file (it is git-ignored).

[secrets]
# Shared by both controllers, the C sentinel and the PC agent. Make one with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
api_token = "CHANGE-ME-to-a-long-random-string"

# Discord bot token (Developer Portal → your application → Bot → Reset Token). docs/SETUP.md, step "Discord".
discord_bot_token = ""
# Optional: without a bot, a channel webhook URL sends messages one way (no commands, no approvals).
discord_webhook_url = ""

# Optional: a GitHub token raises the API rate limit for watching issues (read-only is enough).
github_token = ""

# Only when [triage] run_on = "controller": Claude Code on this machine.
claude_oauth_token = ""
anthropic_api_key = ""
